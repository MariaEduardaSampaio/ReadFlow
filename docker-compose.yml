services:
  postgres:
    image: postgres:16
    container_name: readflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: readflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - readflow_pgdata:/var/lib/postgresql/data

volumes:
  readflow_pgdata:
